name: Lint manifests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - ./maintenance/etcd/Dockerfile
          - ./maintenance/rover-group-sync/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3
        with:
          dockerfile: ${{ matrix.directory }}

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Differential ShellCheck requires full git history
          fetch-depth: 0

      - id: DiffShellCheck
        name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@d965e66ec0b3b2f821f75c8eff9b12442d9a7d1e  # v5.5.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint yaml manifests
        run: |
          yamllint -f github --no-warnings .
      - name: Check for yaml lint warnings
        if: always()
        continue-on-error: true
        run: |
          yamllint -f github -s .
