name: Lint manifests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - ./maintenance/etcd/Dockerfile
          - ./maintenance/rover-group-sync/Dockerfile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3
        with:
          dockerfile: ${{ matrix.directory }}

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Differential ShellCheck requires full git history
          fetch-depth: 0

      - id: DiffShellCheck
        name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@d965e66ec0b3b2f821f75c8eff9b12442d9a7d1e  # v5.5.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
